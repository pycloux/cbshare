[pytest]
# Run from this folder: cd tests/e2e && pytest
pythonpath = .
testpaths = .
# A hung test fails after 5 minutes instead of blocking the run (slow tests
# set their own limit).
timeout = 300
addopts =
    -ra
    --strict-markers
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output test-results
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
