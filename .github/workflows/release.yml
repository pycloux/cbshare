name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # The external tests, full scope: every automated case of the test plan
  # in Chromium (slow ones included) and the browser cases in Firefox and
  # WebKit. Any failure stops the release (see tests/e2e/README.md).
  e2e:
    name: External tests
    uses: ./.github/workflows/e2e.yml
    with:
      scope: full

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="cpsync-${VERSION}-${os}-${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/${name}/cpsync${ext}" ./cmd/cpsync
            cp README.md cpsync.example.yaml "build/${name}/"
            [ -f LICENSE ] && cp LICENSE "build/${name}/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -C build -czf "dist/${name}.tar.gz" "${name}"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "cpsync ${{ github.ref_name }}" --generate-notes
