# Every case of the manual test plan, with its priority and how it is covered.
#
#   automation: automated  a test in this folder is marked with this ID
#               planned    will be automated in a later pull request (#19)
#               manual     cannot be automated; stays in the manual test plan
#               suite      covered by running the whole suite (no single test)
#   manual_part: what remains manual for a case that is only partly automated
#
# tests/e2e/test_consistency.py checks that this file and the tests agree.

