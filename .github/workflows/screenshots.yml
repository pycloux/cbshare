name: Screenshots

# Regenerates the documentation screenshots (docs/images) with
# tests/e2e/tools/screenshots.py and commits them to the branch it ran on.
# Run it from the Actions tab after a visible change to the interface.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build cbshare
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/cbshare" ./cmd/cbshare

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install Playwright and fonts
        working-directory: tests/e2e
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-inter fonts-jetbrains-mono
          # The page asks for system-ui first: make that Inter, like the docs.
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
          </fontconfig>
          EOF
          fc-cache -f >/dev/null

      - name: Take the screenshots
        working-directory: tests/e2e
        run: python tools/screenshots.py --bin "$RUNNER_TEMP/cbshare" --out ../../docs/images

      - name: Commit the images
        run: |
          git add docs/images
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Regenerate the documentation screenshots"
          git push
